services:
  # Einmaliger Init-Schritt vor jedem JD-Start: schaltet die lokale JD-API (Port 3128)
  # in der Config frei. Beendet sich danach (Status "exited" in Portainer ist normal).
  jd-init:
    build:
      context: .                 # Repo als Kontext: Image enthält auch extension/
      dockerfile: webui/Dockerfile
    image: jd-webui:local
    pull_policy: build           # nie von Docker Hub ziehen, bei jedem Deploy neu bauen
    container_name: jd-init
    user: "1000:1000"            # = USER_ID/GROUP_ID von jdownloader
    command: ["python", "/app/jd_init.py"]
    environment:
      - JD_CFG_DIR=/jdconfig/cfg
    volumes:
      - /opt/jdownloader/config:/jdconfig:rw
    network_mode: none
    restart: "no"

  jdownloader:
    image: jlesage/jdownloader-2:latest   # später auf feste Version pinnen (Tags auf Docker Hub)
    container_name: jdownloader
    restart: unless-stopped
    depends_on:
      jd-init:
        condition: service_completed_successfully
    ports:
      - 5800:5800
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Berlin
      - KEEP_APP_RUNNING=1
      - JDOWNLOADER_MAX_MEM=1G
      - SECURE_CONNECTION=1
      - WEB_AUTHENTICATION=1
      - WEB_AUTHENTICATION_USERNAME=${JD_USER}
      - WEB_AUTHENTICATION_PASSWORD=${JD_PASS}
      - WEB_AUTHENTICATION_TOKEN_VALIDITY_TIME=8760   # JD-Oberfläche (5800): 1 Jahr angemeldet bleiben
    volumes:
      - /opt/jdownloader/config:/config:rw
      - /mnt/ssd/Download:/output:rw         # SSD: Zwischenablage, alle Downloads landen zuerst hier (STAGING_DIR)
      - /mnt/data_disk/Fertig:/fertig:rw     # HDD: Pakete ohne Kategorie (FALLBACK_DIR)
      - /mnt/data_disk/Medien:/medien:rw     # HDD: Kategorien Anime/Filme/Serien (siehe CATEGORIES)
      - /mnt/data_disk/Spiele:/spiele:rw     # HDD: Kategorie Spiele
    networks:
      - proxy-network
      - jd-internal

  # Eigene Web-Oberfläche (plain HTTP, nur Intranet) + Click'n'Load-Empfänger
  jd-webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: jd-webui:local
    pull_policy: build           # nie von Docker Hub ziehen, bei jedem Deploy neu bauen
    container_name: jd-webui
    restart: unless-stopped
    depends_on:
      - jdownloader
    ports:
      - ${WEBUI_PORT:-8080}:8080
      - ${CNL_PORT:-9666}:9666   # Click'n'Load, ohne Login - Zugriff über CNL_ALLOWED beschränken
    environment:
      - TZ=Europe/Berlin
      - JD_API_URL=http://jdownloader:3128
      - WEBUI_USER=${JD_USER}
      - WEBUI_PASS=${JD_PASS}
      - CNL_ALLOWED=${CNL_ALLOWED:-}         # z. B. IP deines PCs; leer = jede Adresse
      - CNL_ACTION=${CNL_ACTION:-grabber}     # grabber = im Linkgrabber lassen, queue = in Downloads, start = sofort starten
      - CNL_PUBLIC_PORT=${CNL_PORT:-9666}     # Port von außen, steht in der heruntergeladenen Erweiterung
      - SESSION_DAYS=${SESSION_DAYS:-365}     # so lange bleibt der Browser nach dem Anmelden angemeldet
      # Kategorien im Linkgrabber: Name=Ordner im jdownloader-Container (Volumes oben)
      - CATEGORIES=${CATEGORIES:-Anime=/medien/Anime;Filme=/medien/Filme;Serien=/medien/Serien;Spiele=/spiele}
      - FALLBACK_DIR=${FALLBACK_DIR-/fertig}   # Pakete ohne Kategorie: /fertig/<Paket> (leer = JD-Standardordner)
      # Zwischenablage: erst nach /output/<Paket> (SSD) laden, JD entpackt direkt ins Ziel (HDD),
      # danach verschiebt die WebUI den Rest und löscht den Ordner auf der SSD. Leer = direkt ins Ziel.
      - STAGING_DIR=${STAGING_DIR-/output}
      - POST_INTERVAL=${POST_INTERVAL:-20}     # Sekunden zwischen zwei Prüfungen auf fertige Pakete
    # Gleiche Pfade wie bei jdownloader: die WebUI verschiebt fertige Pakete von /output ins Ziel
    volumes:
      - /mnt/ssd/Download:/output:rw
      - /mnt/data_disk/Fertig:/fertig:rw
      - /mnt/data_disk/Medien:/medien:rw
      - /mnt/data_disk/Spiele:/spiele:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jd-internal

networks:
  proxy-network:
    external: true
  jd-internal:
    driver: bridge
